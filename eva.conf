server {
    listen 80;
    server_name 44.217.180.71;

    # Adjuntos de los avances: Django limita a 5 archivos, 10 MB por
    # archivo y 25 MB por avance. Nginx corta antes cualquier envío mayor.
    client_max_body_size 30M;

    # Los archivos subidos (MEDIA_ROOT) NO se publican: no hay location
    # /media/. Solo se descargan por /gestion/adjuntos/<id>/descargar/,
    # que exige sesión, permiso y pertenecer a la delegación.

    location /static/ {
        alias /home/ec2-user/Eva-Back-end/staticfiles/;
    }

    location / {
        include proxy_params;
        proxy_pass http://unix:/home/ec2-user/Eva-Back-end/Eva-Back-end.sock;
    }

    # phpMyAdmin: solo accesible desde el propio servidor.
    # Para usarlo desde el equipo local se abre un tunel SSH:
    #   ssh -L 8080:127.0.0.1:80 -i sgr-nueva-key.pem ec2-user@44.217.180.71
    #   luego http://localhost:8080/phpmyadmin
    location /phpmyadmin {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        alias /var/www/phpmyadmin/;
        index index.php;

        location ~ ^/phpmyadmin/(.+\.php)$ {
            allow 127.0.0.1;
            allow ::1;
            deny all;

            alias /var/www/phpmyadmin/$1;
            fastcgi_pass unix:/var/run/php-fpm/www.sock;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $request_filename;
        }
    }
}
