<li class="list-group-item d-flex flex-wrap justify-content-between align-items-center gap-2">
    <span>
        <span class="fw-semibold">{{ m.vecino.nombre }}</span>
        {% if m.tipo == 'DIRIGENTE' %}<span class="badge bg-info text-dark">{{ m.get_cargo_display }}</span>{% endif %}
        <div class="small text-muted">{{ m.vecino.rut_formateado }} · desde {{ m.fecha_inicio|date:"d-m-Y" }}</div>
    </span>
    {% if perms.comunidadAPP.change_membresiajunta %}
        <span class="d-flex gap-1">
            <a href="{% url 'comunidad:membresia_editar' m.pk %}" class="btn btn-warning btn-sm">Editar</a>
            <form method="POST" action="{% url 'comunidad:membresia_cerrar' m.pk %}"
                  onsubmit="return confirm('¿Cerrar esta membresía con fecha de hoy? Quedará en el historial.');">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-danger btn-sm">Cerrar</button>
            </form>
        </span>
    {% endif %}
</li>
